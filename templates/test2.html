<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DNA Wave Loader</title>
  <style>
    body {
     /* background-color: #eef6fb;*/
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      color: #0077b6;
      font-size: 2rem;
      margin-bottom: 5px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
      font-size: 1rem;
      font-style: italic;
    }

    .dna-box {
      width: 320px;
      height: 400px;
      border: 2px solid #0077b6;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 119, 182, 0.1);
    }

    .dna-line {
      font-size: 1.2rem;
      margin-bottom: 6px;
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.4s ease;
    }

    .dna-line.show {
      opacity: 1;
      transform: translateX(0);
    }

    .A { color: #ff6b6b; }
    .T { color: #feca57; }
    .C { color: #1dd1a1; }
    .G { color: #54a0ff; }
  </style>
</head>
<body>
<form name="form1" method="post">
<input type="hidden" id="value1" value="{{value}}">
</form>

  <div class="dna-box" id="dnaBox" align="center"></div>

  <script>
    const sequence = document.getElementById('value1').value;
    const box = document.getElementById('dnaBox');

    let index = 0;
    let chunkSize = 6;
    let direction = -1; // -1 to shrink, +1 to grow

    function loadNextChunk() {
      if (index >= sequence.length) {
        //setTimeout(() => window.location.href = "/result", 1000);
        return;
      }

      const chunk = sequence.slice(index, index + chunkSize);
      const line = document.createElement("div");
      line.className = "dna-line";

      [...chunk].forEach(c => {
        const span = document.createElement("span");
        span.textContent = c;
        span.className = c;
        line.appendChild(span);
      });

      box.appendChild(line);
      setTimeout(() => line.classList.add("show"), 10);

      index += chunkSize;

      // update chunk size for next wave
      chunkSize += direction;
      if (chunkSize <= 2 || chunkSize >= 6) {
        direction *= -1;
      }

      setTimeout(loadNextChunk, 100);
    }

    loadNextChunk();
  </script>


<script>
//Using setTimeout to execute a function after 5 seconds.
setTimeout(function () {
   //Redirect with JavaScript
   window.location.href= '/test3?act=result';
}, 8000);
</script>
</body>
</html>
